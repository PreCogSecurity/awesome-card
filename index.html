<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>awesome-card demo</title>
  <meta name="description" content="Demo of awesome-card, a tiny 3D tilt effect for a DOM card.">
  <meta content="yes" name="apple-mobile-web-app-capable" />
  <meta content="yes" name="apple-touch-fullscreen" />
  <meta content="telephone=no,email=no" name="format-detection" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no" />
  <!--
    Third-party stylesheet. referrerpolicy="no-referrer" keeps the visitor URL out
    of the CDN's logs. For anything you ship to customers, self-host this file
    (or add an `integrity` hash) so a compromised CDN cannot restyle - or read -
    your page.
  -->
  <link href="https://a.alipayobjects.com/g/antui/antui/10.0.12/rem/antui.css" rel="stylesheet" referrerpolicy="no-referrer" />
  <style>
    .container {
      color: white;
      font-family: sans-serif;
      font-weight: 100;
      font-size: 2em;
    }

    .d {
      width: 100%;
      background: #108ee9;
      box-shadow: none;
      border-radius: 10px;
      transition: all 300ms;
    }

    .d.active {
      box-shadow: gray 0px 0px 20px 2px;
    }

    .title {
      padding: 20px;
      color: white;
      font-family: sans-serif;
      font-weight: 100;
    }

    .number {
      padding: 20px;
      font-size: 0.5em;
    }

    .exp {
      font-size: 0.2em;
      padding: 20px;
    }
  </style>
</head>

<body>

  <div class="container am-wingblank wb15px">
    <div class="am-whitespace ws10px"></div>

    <div class="am-whitespace ws10px"></div>

    <div class="d" id="d">
      <div class="title">
        AR Go!
      </div>
      <div class="number">No. <span>12345679</span> <span style="float:right">alibaba</span></div>
      <div class="exp">* 解释权归我所有</div>
    </div>
  </div>

  <script src="index.js"></script>
  <script src="demo.js"></script>
</body>

</html>
