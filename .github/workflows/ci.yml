name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least privilege: CI only ever needs to read the repository.
permissions:
  contents: read

# Superseded runs add nothing but minutes; cancel them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint & dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      # --ignore-scripts: jest/eslint need no install scripts, and skipping them
      # means a compromised dependency cannot execute code in CI.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm audit --audit-level=high

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci --ignore-scripts
      # Coverage thresholds live in the jest config, so a drop below them fails here.
      - run: npm test -- --coverage
